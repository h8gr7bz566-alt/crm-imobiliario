<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - CRM Imobiliário</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo" aria-label="ImobiPro Home">
        <img src="logo.png" alt="ImobiPro" class="logo-img">
        <div>
          <div class="brand">Imobi<span class="accent">Pro</span></div>
          <div class="tag">Painel do Corretor</div>
        </div>
      </a>
      <nav class="top-actions">
        <a href="index.html" class="btn btn-glass">Ver Site Público</a>
        <a href="https://wa.me/5547999701743" class="btn btn-glass" target="_blank" rel="noopener">💬 WhatsApp</a>
      </nav>
    </div>
  </header>

  <div id="admin-login" class="modal">
    <div class="modal-content">
      <h3>Entrar no Painel do Corretor</h3>
      <form id="login-form">
        <label>Senha<input name="password" type="password" required></label>
        <div class="actions">
          <button class="btn" type="submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <main class="admin hidden" id="admin-root">
    <section class="panel">
      <h2>Painel de Controle</h2>
      <div class="panel-grid">
        <div>
          <h3>Cadastrar Imóvel</h3>
          <form id="property-form" class="card">
            <label>Título<input name="title" required></label>
            <label>Endereço<input name="address"></label>
            <label>Cidade<select name="city" required>
              <option value="">Selecione uma cidade</option>
              <option value="Itapema (SC)">Itapema (SC)</option>
              <option value="Balneário Camboriú (SC)">Balneário Camboriú (SC)</option>
              <option value="Itajaí (SC)">Itajaí (SC)</option>
              <option value="Porto Belo (SC)">Porto Belo (SC)</option>
              <option value="Florianópolis (SC)">Florianópolis (SC)</option>
              <option value="Curitiba (PR)">Curitiba (PR)</option>
              <option value="Ponta Grossa (PR)">Ponta Grossa (PR)</option>
              <option value="Carambeí (PR)">Carambeí (PR)</option>
              <option value="Maringá (PR)">Maringá (PR)</option>
            </select></label>
            <label>Bairro<input name="neighborhood"></label>
            <label>Preço<input name="price" required></label>
            <label>Quartos<input name="bedrooms" type="number" min="1"></label>
            <label>Vagas de Garagem<input name="parking" type="number" min="0"></label>
            <label>Foto do Imóvel<input name="image" type="file" accept="image/*" required></label>
            <label>Descrição<textarea name="description"></textarea></label>
            <div class="actions">
              <button type="submit" class="btn">Salvar Imóvel</button>
            </div>
          </form>
        </div>

        <div>
          <h3>Leads</h3>
          <div id="leads" class="card small-list"></div>
        </div>
      </div>

      <h3>Imóveis Cadastrados</h3>
      <div id="admin-properties" class="grid"></div>
    </section>
  </main>

  <a href="https://wa.me/5547999701743" class="floating-whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

  <footer class="footer">
    <small>Área restrita — apenas para o corretor</small>
  </footer>
</body>
</html>
