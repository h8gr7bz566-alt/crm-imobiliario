  <script>
    function openLightbox(idx) {
      const lb = document.getElementById('lightbox')
      lb.style.display = 'flex'
      document.body.style.overflow = 'hidden'
      updateLightbox(idx)
    }
    function updateLightbox(idx) {
      const imgs = window._galleryImages || []
      if (!imgs.length) return
      idx = (idx + imgs.length) % imgs.length
      window._lbIdx = idx
      document.getElementById('lightbox-img').src = imgs[idx]
      document.getElementById('lightbox-counter').textContent = imgs.length > 1 ? `${idx+1} / ${imgs.length}` : ''
    }
    function lightboxNav(dir) {
      updateLightbox((window._lbIdx || 0) + dir)
    }
    function closeLightbox(e) {
      if (e.target === document.getElementById('lightbox')) {
        document.getElementById('lightbox').style.display = 'none'
        document.body.style.overflow = ''
      }
    }
    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox')
      if (lb.style.display === 'none') return
      if (e.key === 'ArrowRight') lightboxNav(1)
      if (e.key === 'ArrowLeft')  lightboxNav(-1)
      if (e.key === 'Escape') { lb.style.display='none'; document.body.style.overflow='' }
    })
  </script>
