  <script>
    // i18n mínimo para que setLang funcione nesta página
    const translations = {
      pt: { 'nav.institucional': 'Institucional' },
      en: { 'nav.institucional': 'About' },
      es: { 'nav.institucional': 'Nosotros' }
    }
    function setLang(lang) {
      try { localStorage.setItem('lang', lang) } catch(e) {}
      window.currentLang = lang
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n')
        const t = translations[lang]?.[key]
        if (t) el.innerHTML = t
      })
      const btns = { pt:'lang-pt', en:'lang-en', es:'lang-es' }
      Object.entries(btns).forEach(([l, id]) => {
        const btn = document.getElementById(id)
        if (btn) btn.style.background = l === lang ? 'rgba(184,150,46,0.25)' : 'none'
      })
      if (typeof renderPublic === 'function') renderPublic()
    }
    // Lê filtros passados via URL e pré-preenche os selects
    function applyUrlFilters() {
      const params = new URLSearchParams(window.location.search)
      const map = {
        city:         'city-filter',
        neighborhood: 'neighborhood-filter',
        bedrooms:     'bedrooms-filter',
        parking:      'parking-filter',
        construction: 'construction-filter',
      }
      Object.entries(map).forEach(([param, id]) => {
        const val = params.get(param)
        if (val) {
          const el = document.getElementById(id)
          if (el) {
            // Cria a option se não existir (para cidade/bairro populados via JS)
            if (!el.querySelector(`option[value="${val}"]`)) {
              const opt = document.createElement('option')
              opt.value = val
              opt.textContent = val
              el.appendChild(opt)
            }
            el.value = val
          }
        }
      })
      const priceRange = params.get('price_range')
      if (priceRange) {
        const sel = document.getElementById('price-range')
        if (sel) sel.value = priceRange
      }
    }

    // Restaura idioma salvo
    try {
      const saved = localStorage.getItem('lang') || 'pt'
      window.currentLang = saved
      document.addEventListener('DOMContentLoaded', () => {
        applyUrlFilters()
        setLang(saved)
      })
    } catch(e) { window.currentLang = 'pt' }
  </script>
